services:
  - type: web
    name: nexvora-search
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: nexvora-postgres
          property: connectionString
      - key: GITHUB_POLL_INTERVAL_SEC
        value: "300"
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: "main"
      - key: GITHUB_SOURCES_PATH
        value: "sources"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://www.nexvora.com"

databases:
  - name: nexvora-postgres
    plan: starter
    databaseName: nexvora_db
    user: nexvora_user
