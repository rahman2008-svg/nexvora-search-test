<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexVora Search</title>
    <meta name="description" content="Independent, deterministic, privacy-first web search engine powered by GitHub source registries, persistent web crawling, and BM25 ranking without AI." />
    <link rel="canonical" href="https://www.nexvora.com/" />
    <meta property="og:title" content="NexVora Search" />
    <meta property="og:description" content="Independent, deterministic, privacy-first web search engine powered by GitHub source registries, persistent web crawling, and BM25 ranking without AI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nexvora.com/" />
    <meta property="og:site_name" content="NexVora Search" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.nexvora.com/" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/><path d='M11 8v6'/><path d='M8 11h6'/></svg>" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NexVora Search",
      "url": "https://www.nexvora.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.nexvora.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-blue-500/20 selection:text-blue-600 dark:selection:text-blue-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
